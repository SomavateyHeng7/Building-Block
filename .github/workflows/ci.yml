name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Generates the route-aware type helpers (LayoutProps, PageProps) into .next/types.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: pnpm test
      - run: npx playwright install --with-deps chromium
      # Builds the app and runs the browser tests on desktop, tablet and phone.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
