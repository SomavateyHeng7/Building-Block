name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the code: no write access for the token, in case a dependency or action is compromised.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Generates next-env.d.ts and the route type globals (LayoutProps, PageProps) that tsc needs.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      # Fails on known high-severity advisories in runtime dependencies.
      - run: pnpm audit --prod --audit-level high
